name: OpenVisionMVP
options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    META_APP_ID: "0"
    CLIENT_TOKEN: ""
packages:
  OpenVisionCore:
    path: Core
  SubscriptionCore:
    path: Subscription
  MetaDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.1"
targets:
  OpenVisionMVP:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andywang.openvision.mvp
        PRODUCT_NAME: OpenVisionMVP
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
    dependencies:
      - package: OpenVisionCore
      - package: SubscriptionCore
      - package: MetaDAT
        product: MWDATCore
      - package: MetaDAT
        product: MWDATCamera
  OpenVisionMVPPlatformTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlatformTests
      # Compile the exact production control/storage sources in an isolated test bundle.
      # No application host is launched, so tests cannot restore a user's account.
      - path: App/GlassesPhotoService.swift
      - path: App/DATCameraDriver.swift
      - path: App/SpeechService.swift
      - path: App/SpeechDriver.swift
      - path: App/Account/ChatGPTSessionStore.swift
      - path: App/Account/PlanCredentialStorage.swift
    dependencies:
      - package: OpenVisionCore
      - package: SubscriptionCore
      - package: MetaDAT
        product: MWDATCore
      - package: MetaDAT
        product: MWDATCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.andywang.openvision.mvp.platformtests
  OpenVisionMVPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenVisionMVP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.andywang.openvision.mvp.uitests
        TEST_TARGET_NAME: OpenVisionMVP
schemes:
  OpenVisionMVP:
    build:
      targets:
        OpenVisionMVP: all
    test:
      targets: [OpenVisionMVPPlatformTests, OpenVisionMVPUITests]
      gatherCoverageData: true
