name: Bilingual MVP
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mvp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install project generator
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Portable production checks
        run: bash MVP/scripts/check-local.sh
      - name: XCTest packages
        run: |
          swift test --package-path MVP/Core
          swift test --package-path MVP/Subscription
      - name: Build and launch simulator tests
        run: bash MVP/scripts/check-ios.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-test-evidence
          path: .test-results/
          if-no-files-found: ignore
